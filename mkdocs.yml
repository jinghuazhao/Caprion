site_name: Caprion
repo_url: https://github.com/jinghuazhao/Caprion
edit_uri: ""
nav:
  - "": README.md
  - "Pilot studies":
    - pilot/autoencoder/README.md
    - pilot/gwas2/README.md
    - pilot/README.md
  - Analysis:
    - progs/README.md
    - peptide_progs/README.md
    - pipeline/README.md
    - ZWK/reference_ZWK/README.md
    - misc/README.md
  - "Additional information":
    - "Caprion panel": https://jinghuazhao.github.io/pQTLdata/reference/caprion.html
    - Data.md
    - Notes.md
theme:
    name: mkdocs
    nav_style: dark
    highlightjs: true
    hljs_languages:
        - Bash
        - HTML
        - Java
        - JavaScript
        - Perl
        - Python
        - R
        - rust
        - yaml
plugins:
    - search
    - mermaid2
exclude_docs: |
  /pipeline/dry_run_98_v2/
  /pipeline/fragpipe_test_home/
  /pipeline/production_runs/
  /pipeline/reports/
  /ZWK/reference_ZWK/
  /ZWK/default/
  /ZWK/default-rev/
  /ZWK/discovery_fresh/
  /ZWK/metamorpheus/
  /ZWK/msamanda/
  /ZWK/mzML/
  /ZWKraw/
  /ZWK/reference_ZWK/
  /ZWK/sage/
  /ZWK/test/
markdown_extensions:
  - attr_list
  - footnotes
  - meta
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
validation:
  unrecognized_links: ignore
